services:
  postgres:
    image: postgres:15-alpine
    container_name: ziganya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ziganya
      POSTGRES_PASSWORD: ziganya
      POSTGRES_DB: ziganya
    ports:
      - "5432:5432"
    volumes:
      - ziganya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziganya -d ziganya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ziganya_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ziganya_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ziganya_pgdata:
  ziganya_redisdata:
